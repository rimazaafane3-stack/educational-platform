{% extends "base.html" %}
{% block title %}رفع فيديو من الجهاز{% endblock %}

{% block content %}
<div class="admin-page">
  <div class="admin-header">
    <h1><i class="fas fa-upload"></i> رفع فيديو من جهازك</h1>
    <a href="{{ url_for('admin.videos') }}" class="btn-back"><i class="fas fa-arrow-right"></i> العودة</a>
  </div>

  <form method="POST" enctype="multipart/form-data" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label>عنوان الفيديو <span class="req">*</span></label>
      <input type="text" name="title" class="form-control" placeholder="عنوان الفيديو" required>
    </div>

    <div class="form-grid two-col">
      <div class="form-group">
        <label>المادة <span class="req">*</span></label>
        <select name="subject_id" class="form-control" required>
          <option value="">-- اختر المادة --</option>
          {% for s in subjects %}
          <option value="{{ s.id }}">{{ s.icon }} {{ s.name_ar or s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>المدة (مثال: 10:30)</label>
        <input type="text" name="duration" class="form-control" placeholder="10:30">
      </div>
    </div>

    <div class="form-group">
      <label>وصف الفيديو</label>
      <textarea name="description" class="form-control" rows="2" placeholder="وصف مختصر..."></textarea>
    </div>

    <div class="form-group">
      <label>ملف الفيديو <span class="req">*</span></label>
      <div id="dropZone" style="border:3px dashed var(--border);border-radius:14px;padding:2.5rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);"
           onclick="document.getElementById('videoFile').click()"
           ondragover="event.preventDefault();this.style.borderColor='var(--primary)'"
           ondragleave="this.style.borderColor='var(--border)'"
           ondrop="handleDrop(event)">
        <div style="font-size:3rem;margin-bottom:.5rem;" id="dropIcon">🎥</div>
        <p style="font-weight:700;" id="dropText">اسحب الفيديو هنا أو اضغط للاختيار</p>
        <small style="color:var(--text-light);">MP4, WEBM, MOV — حجم أقصى 500MB</small>
      </div>
      <input type="file" id="videoFile" name="video_file" accept="video/*" style="display:none"
             onchange="updateDropZone(this)">
    </div>

    <div id="videoPreviewWrap" style="display:none;margin-top:.75rem;">
      <video id="videoPreview" controls style="width:100%;border-radius:12px;max-height:300px;"></video>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit" id="submitBtn">
        <i class="fas fa-upload"></i> رفع الفيديو
      </button>
      <a href="{{ url_for('admin.videos') }}" class="btn-cancel">إلغاء</a>
    </div>
  </form>
</div>

<script>
function updateDropZone(input) {
  if (!input.files[0]) return;
  const f = input.files[0];
  document.getElementById('dropIcon').textContent = '✅';
  document.getElementById('dropText').textContent = f.name;
  const url = URL.createObjectURL(f);
  document.getElementById('videoPreview').src = url;
  document.getElementById('videoPreviewWrap').style.display = 'block';
}
function handleDrop(e) {
  e.preventDefault();
  const fi = document.getElementById('videoFile');
  fi.files = e.dataTransfer.files;
  updateDropZone(fi);
}
</script>
{% endblock %}
