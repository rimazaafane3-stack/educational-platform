{% extends "base.html" %}
{% block title %}{% if video %}تعديل الفيديو{% else %}إضافة فيديو{% endif %}{% endblock %}

{% block content %}
<div class="admin-page">
  <div class="admin-header">
    <h1>{% if video %}<i class="fas fa-edit"></i> تعديل الفيديو{% else %}<i class="fas fa-plus"></i> إضافة فيديو جديد{% endif %}</h1>
    <a href="{{ url_for('admin.videos') }}" class="btn-back">
      <i class="fas fa-arrow-right"></i> العودة
    </a>
  </div>

  <form method="POST" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label>عنوان الفيديو <span class="req">*</span></label>
      <input type="text" name="title" class="form-control"
             value="{{ video.title if video else '' }}"
             placeholder="مثال: شرح الجمع والطرح" required>
    </div>

    <div class="form-grid two-col">
      <div class="form-group">
        <label>المادة الدراسية <span class="req">*</span></label>
        <select name="subject_id" class="form-control" required>
          <option value="">-- اختر المادة --</option>
          {% for s in subjects %}
          <option value="{{ s.id }}" {% if video and video.subject_id == s.id %}selected{% endif %}>
            {{ s.icon }} {{ s.name_ar or s.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>مدة الفيديو (مثال: 10:30)</label>
        <input type="text" name="duration" class="form-control"
               value="{{ video.duration if video else '' }}" placeholder="10:30">
      </div>
    </div>

    <div class="form-group">
      <label><i class="fab fa-youtube" style="color:#ff0000"></i> رابط YouTube <span class="req">*</span></label>
      <input type="url" name="youtube_url" id="ytUrl" class="form-control"
             value="{{ video.youtube_url if video else '' }}"
             placeholder="https://www.youtube.com/watch?v=..."
             oninput="previewYoutube(this.value)">
      <small>الصق رابط الفيديو من YouTube</small>
    </div>

    <!-- YouTube Preview -->
    <div class="form-group" id="ytPreviewWrap" style="display:{% if video and video.get_embed_url() %}block{% else %}none{% endif %}">
      <label>معاينة الفيديو</label>
      <div class="yt-preview-wrap">
        <iframe id="ytPreviewFrame"
                src="{{ video.get_embed_url() if video else '' }}"
                frameborder="0" allowfullscreen
                style="width:100%; height:300px; border-radius:12px"></iframe>
      </div>
    </div>

    <div class="form-group">
      <label>وصف الفيديو</label>
      <textarea name="description" class="form-control" rows="3"
                placeholder="وصف مختصر لمحتوى الفيديو...">{{ video.description if video else '' }}</textarea>
    </div>

    <div class="form-group">
      <label>الترتيب</label>
      <input type="number" name="order" class="form-control"
             value="{{ video.order if video else 0 }}" min="0">
    </div>

    {% if video %}
    <div class="form-group">
      <label>الحالة</label>
      <div class="toggle-wrap">
        <input type="checkbox" name="is_active" id="isActive" {% if video.is_active %}checked{% endif %}>
        <label for="isActive" class="toggle-label">مفعّل</label>
      </div>
    </div>
    {% endif %}

    <div class="form-actions">
      <button type="submit" class="btn-submit">
        <i class="fas fa-save"></i> {% if video %}حفظ التعديلات{% else %}إضافة الفيديو{% endif %}
      </button>
      <a href="{{ url_for('admin.videos') }}" class="btn-cancel">إلغاء</a>
    </div>
  </form>
</div>

<script>
function previewYoutube(url) {
  const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
  const wrap  = document.getElementById('ytPreviewWrap');
  const frame = document.getElementById('ytPreviewFrame');
  if (match) {
    frame.src = `https://www.youtube.com/embed/${match[1]}?rel=0`;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
  }
}
</script>
{% endblock %}
