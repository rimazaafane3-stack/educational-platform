{% extends "base.html" %}
{% block title %}إضافة شارة{% endblock %}

{% block content %}
<div class="admin-page">
  <div class="admin-header">
    <h1><i class="fas fa-plus"></i> إضافة شارة جديدة</h1>
    <a href="{{ url_for('admin.badges') }}" class="btn-back">
      <i class="fas fa-arrow-right"></i> العودة
    </a>
  </div>

  <form method="POST" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-grid two-col">
      <div class="form-group">
        <label>اسم الشارة <span class="req">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="مثال: النجم المتميز" required>
      </div>
      <div class="form-group">
        <label>الأيقونة (Emoji)</label>
        <input type="text" name="icon" class="form-control icon-input" value="🏅" placeholder="🏅">
      </div>
    </div>

    <div class="form-group">
      <label>وصف الشارة</label>
      <textarea name="description" class="form-control" rows="2" placeholder="متى تُمنح هذه الشارة؟"></textarea>
    </div>

    <div class="form-grid two-col">
      <div class="form-group">
        <label>اللون</label>
        <input type="color" name="color" class="color-picker" value="#F59E0B">
      </div>
      <div class="form-group">
        <label>الشرط (condition)</label>
        <select name="condition" class="form-control">
          <option value="">-- بلا شرط تلقائي --</option>
          <option value="welcome">welcome — عند التسجيل</option>
          <option value="first_lesson">first_lesson — أول درس مكتمل</option>
          <option value="first_quiz">first_quiz — أول امتحان</option>
          <option value="perfect_score">perfect_score — نتيجة 100%</option>
        </select>
        <small>الشرط يُمنح تلقائياً عند تحقق الحدث</small>
      </div>
    </div>

    <div class="form-group">
      <label>النقاط المطلوبة (0 = لا يوجد حد)</label>
      <input type="number" name="points_required" class="form-control" value="0" min="0">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit">
        <i class="fas fa-save"></i> إضافة الشارة
      </button>
      <a href="{{ url_for('admin.badges') }}" class="btn-cancel">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}
